name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install ".[test,experiments]"
      - name: Run example
        run: python scripts/run_example.py
      - name: Verify v10 core and published result records
        run: |
          python scripts/build_v10_core.py --check
          python scripts/verify_checksums.py
          python scripts/verify_release_results.py
      - name: Run regression tests
        run: python -m unittest discover -v
