[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sni-dpc"
version = "10.0.65"
description = "Screened Natural-Neighbor Interaction Field for automatic Density Peaks Clustering"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Yumou Zhang" },
  { name = "Lijun Yang", email = "ylijun@swun.edu.cn" },
]
dependencies = [
  "numpy==2.2.5",
  "scikit-learn==1.7.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
experiments = [
  "scipy==1.15.3",
  "pandas==2.3.3",
  "matplotlib==3.10.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
